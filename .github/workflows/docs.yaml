name: Generate API documentation

on:
  push:
    branches:
      - master
      # TODO: temporary, so docs can be reviewed on GitHub Pages; remove before merge
      - 'feature/ADCM-6490'
    paths: &docs-sources
      - 'adcm_aio_client/**'
      - 'gen_doc.sh'
      - 'pdoc_cli.py'
      - 'custom-templates/**'
      - 'pyproject.toml'
      - 'poetry.lock'
      - '.github/workflows/docs.yaml'
  # build-only check, so changes breaking docs generation are caught before merge
  pull_request:
    paths: *docs-sources
  workflow_dispatch:

permissions:
  contents: read

# allow only one deployment at a time, but don't cancel in-progress ones
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --with docs --no-root
      - name: Generate documentation
        run: ./gen_doc.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # TODO: temporary deploy from `feature/ADCM-6490` for docs review; restore master-only condition before merge:
    #   if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    if: >-
      github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/ADCM-6490')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
