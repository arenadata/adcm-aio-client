name: website

on:
  push:
    branches:
      - ADCM-6367-pdoc-deploy

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install poetry
        run: python -m pip install poetry
      - run: poetry install --with docs --no-root
      - run: poetry run pdoc -o docs/ adcm_aio_client adcm_aio_client/mapping adcm_aio_client/mapping/_types.py adcm_aio_client/mapping/__init__.py adcm_aio_client/mapping/_refresh.py adcm_aio_client/mapping/_objects.py adcm_aio_client/_types.py adcm_aio_client/requesters.py adcm_aio_client/config adcm_aio_client/config/_types.py adcm_aio_client/config/__init__.py adcm_aio_client/config/_refresh.py adcm_aio_client/config/_objects.py adcm_aio_client/config/_operations.py adcm_aio_client/client.py adcm_aio_client/__init__.py adcm_aio_client/objects adcm_aio_client/objects/_base.py adcm_aio_client/objects/_cm.py adcm_aio_client/objects/_common.py adcm_aio_client/objects/__init__.py adcm_aio_client/objects/_imports.py adcm_aio_client/objects/_accessors.py adcm_aio_client/_session.py adcm_aio_client/host_groups adcm_aio_client/host_groups/_action_group.py adcm_aio_client/host_groups/_common.py adcm_aio_client/host_groups/__init__.py adcm_aio_client/host_groups/_config_group.py adcm_aio_client/actions adcm_aio_client/actions/__init__.py adcm_aio_client/actions/_objects.py adcm_aio_client/errors.py adcm_aio_client/_filters.py adcm_aio_client/_utils.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4