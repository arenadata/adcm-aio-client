---
- type: cluster
  name: cluster_with_license
  version: '2.0'
  edition: enterprise
  config_group_customization: true
  license: ./EULA.txt
  upgrade:
    - name: upgrade
      versions: &id001
        min: '1.0'
        max: '2.0'
      states: &id002
        available: any
    - name: upgrade_via_action_simple
      versions: *id001
      states: *id002
      scripts:
        - name: pre
          script: ./playbook.yaml
          script_type: ansible
        - name: switch
          script: bundle_switch
          script_type: internal
        - name: post
          script: ./playbook.yaml
          script_type: ansible
    - name: unfit_version
      versions:
        min_strict: '0'
        max: '0.3'
      states: *id002
    - name: unfit_state
      versions: *id001
      states:
        available:
          - doesnotexist
  config: &id003
    - name: string
      type: string
      required: false
      default: string
    - name: group
      type: group
      subs:
        - name: string
          type: string
          required: false
          default: string
  actions:
    action: &id004
      states:
        available: any
      scripts:
        - name: action
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- name: service_1
  type: service
  version: '2.0'
  config: *id003
  license: ./license.txt
  actions:
    action: *id004
  components:
    component_1:
      constraint:
        - 0
        - +
      config: *id003
      actions:
        action_1_comp_1: *id004
        action_2_comp_1: *id004
    component_2:
      constraint:
        - 0
        - +
      config: *id003
      actions:
        action_1_comp_2: *id004
- name: service_2
  type: service
  version: '2.0'
  config: *id003
  actions:
    action_1_service_2: *id004
    action_2_service_2: *id004
- name: service_3_manual_add
  type: service
  version: '2.0'
  config: *id003
- name: service_with_bound_to
  type: service
  version: hehe
  components:
    will_have_bound_to:
      description: This component will have `bound_to` constraint after upgrade
