---
- type: cluster
  name: Some Cluster
  config_group_customization: true
  version: 1
  allow_maintenance_mode: true
  upgrade:
    - name: Simple
      display_name: I am very simple, you know?
      versions: &id001
        min: 0.1
        max: 0.9
      states: &id002
        available: any
    - name: action_config
      display_name: With action and config
      scripts:
        - name: pre
          script_type: ansible
          script: ./actions.yaml
          params:
            ansible_tags: ok
        - name: switch
          script_type: internal
          script: bundle_switch
        - name: post
          script_type: ansible
          script: ./actions.yaml
          params:
            ansible_tags: ok
      config: &id005
        - name: string_field
          type: string
        - name: params
          display_name: Some Params
          type: group
          subs:
            - name: cant_find
              type: string
              default: cantCme
              ui_options:
                invisible: true
            - name: pass
              type: password
              required: false
            - name: sag
              display_name: Filter
              type: structure
              yspec: ./sag.yaml
              default:
                nested:
                  attr: nice
                  op: eq
                  tech: 'true'
                quantity: 14443
        - name: payload
          display_name: Request Body
          type: json
          default:
            - 1
            - k: v
            - plain
      versions: *id001
      states: *id002
  actions: &id010
    success:
      display_name: I will survive
      allow_to_terminate: true
      allow_for_action_host_group: true
      masking: &id003 {}
      scripts:
        - name: success
          script: ./actions.yaml
          script_type: ansible
          params: &id006
            ansible_tags: ok
    fail:
      display_name: no Way
      allow_to_terminate: true
      allow_for_action_host_group: true
      masking: *id003
      scripts:
        - name: fail
          script: ./actions.yaml
          script_type: ansible
          params:
            ansible_tags: fail
    success_task:
      display_name: Lots Of me
      masking: {}
      allow_to_terminate: true
      allow_for_action_host_group: true
      scripts:
        - name: first
          script_type: ansible
          script: ./actions.yaml
          params: &id004
            ansible_tags: ok, sleep
        - name: second
          display_name: AnothEr
          script_type: ansible
          script: ./actions.yaml
          params: *id004
    with_config:
      display_name: Configurable one
      config: *id005
      allow_to_terminate: true
      allow_for_action_host_group: true
      masking: *id003
      scripts:
        - name: with_config
          script: ./actions.yaml
          script_type: ansible
          params: *id006
    with_mapping:
      display_name: I will change the cluster
      hc_acl: &id007
        - action: add
          service: example_1
          component: first
        - action: remove
          service: example_2
          component: second
      allow_to_terminate: true
      allow_for_action_host_group: true
      masking: *id003
      scripts:
        - name: with_mapping
          script: ./actions.yaml
          script_type: ansible
          params: *id006
    with_config_and_mapping:
      display_name: JOAT
      config: *id005
      hc_acl: *id007
      allow_to_terminate: true
      allow_for_action_host_group: true
      masking: *id003
      scripts:
        - name: with_config_and_mapping
          script: ./actions.yaml
          script_type: ansible
          params: *id006
  config:
    - name: string_field
      type: string
      default: string value
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: example_1
  display_name: First Example
  version: 1.0
  config: &id008
    - name: root_int
      display_name: Integer At Root
      type: integer
      default: 100
  components: &id009
    first:
      display_name: First Component
      config: *id008
    second:
      display_name: Second Component
      config: *id008
    third_one:
      display_name: This Is Different
      config: *id008
- type: service
  name: example_2
  version: 4.23.456
  components: *id009
- type: service
  name: with_actions
  version: 2.3
  actions: *id010
  components:
    c1:
      display_name: Awesome
      actions: *id010
    c2:
      actions: *id010
- type: service
  name: with_license
  version: 1
  license: ./license.txt
- type: service
  name: complex_config
  version: 0.3
  config_group_customization: true
  config:
    - name: complexity_level
      display_name: Complexity Level
      type: integer
      default: 4
      required: false
    - name: very_important_flag
      display_name: Set me
      type: float
      required: true
    - name: int_field
      display_name: Integer Field
      type: integer
      required: false
    - name: int_field2
      display_name: Integer Field 2
      type: integer
      required: false
    - name: cant_find
      type: string
      default: cantCme
      ui_options:
        invisible: true
    - name: country_codes
      type: structure
      yspec: ./schema.yaml
      default:
        - country: Greece
          code: 30
        - country: France
          code: 33
        - country: Spain
          code: 34
    - name: a_lot_of_text
      display_name: A lot of text
      type: group
      subs:
        - name: cant_find
          type: string
          default: cantCme
          ui_options:
            invisible: true
        - name: simple_string
          type: string
          required: false
          default: simple string here
        - name: big_text
          type: text
          required: false
          default: ''
        - name: license
          description: Edit license as you want :3
          read_only: any
          type: file
          default: ./text.txt
        - name: pass
          type: password
          required: false
        - name: sag
          display_name: Group-like structure
          type: structure
          yspec: ./sag.yaml
          required: false
    - name: from_doc
      display_name: Examples from documentation
      type: group
      ui_options:
        advanced: true
      subs:
        - name: memory_size
          type: integer
          default: 16
          min: 2
          max: 64
          ui_options:
            invinsible: true
        - name: cluster_host
          type: variant
          required: false
          source:
            type: builtin
            name: host_in_cluster
        - name: secret_mapping
          display_name: Map Secrets
          type: secretmap
          required: false
        - name: mount_points
          type: list
          default:
            - /dev/rdisk0s1
            - /dev/rdisk0s2
            - /dev/rdisk0s3
          read_only: any
        - name: person
          type: map
          default:
            name: Joe
            age: '24'
            sex: m
        - name: protocol
          type: option
          option:
            http: '80'
            https: '443'
          default: '80'
    - name: agroup
      display_name: Optional
      type: group
      activatable: true
      active: false
      subs:
        - name: justhere
          type: integer
          required: false
        - name: field2
          type: integer
          required: false
    - name: more
      type: group
      subs:
        - name: strange
          type: json
          default: []
    - name: protagonist
      type: selection_group
      group_customization: false
      default: young
      subs: &id011
        - name: young
          type: group
          subs:
            - name: strength
              type: integer
              default: 4
        - name: mediocre
          type: group
          subs:
            - name: wealth
              type: integer
        - name: old
          type: group
          subs:
            - name: wizdom
              type: integer
    - name: antagonist
      type: selection_group
      group_customization: false
      required: false
      subs: *id011
  components:
    component1: null
- type: service
  name: with_host_actions
  version: 2.3
  components:
    c1:
      display_name: c1
      config:
        - name: very_important_flag
          display_name: Set me
          type: string
          required: true
          default: default
      actions: &id012
        host_action_config_hc_acl:
          display_name: acl_host_action
          host_action: true
          allow_to_terminate: true
          config:
            - name: very_important_flag
              type: string
          hc_acl:
            - service: with_host_actions
              component: c2
              action: add
            - service: with_host_actions
              component: c1
              action: remove
          masking: {}
          scripts:
            - name: host_action_config_hc_acl
              script: ./actions.yaml
              script_type: ansible
              params:
                ansible_tags: change
    c2:
      actions: *id012
- type: service
  version: 1.0
  name: my_service
  components:
    my_component: null
- type: service
  version: 1.0
  name: service_with_requires_my_component
  components:
    componentB: null
  requires:
    - service: my_service
      component: my_component
- type: service
  version: 1.0
  name: service_with_requires_my_service
  requires:
    - service: my_service
- type: service
  version: 1.0
  name: component_with_requires_my_component
  components:
    component_with_requires_my_component:
      requires:
        - service: my_service
          component: my_component
- type: service
  version: 1.0
  name: component_with_requires_my_service
  components:
    component_with_requires_my_service:
      requires:
        - service: my_service
- type: service
  version: 2.3
  name: A
  requires:
    - service: B
  components:
    a1:
      requires:
        - service: C
- type: service
  version: 2.4
  name: B
  requires:
    - service: A
- type: service
  version: 2.1
  name: C
  requires:
    - service: A
  components:
    c1:
      requires:
        - service: B
