---
- type: provider
  name: simple_provider
  version: 4
  upgrade:
    - name: simple_provider
      display_name: simple upgrade
      versions:
        min: 1
        max: 4
      states:
        available: any
  actions: &id001
    success:
      display_name: I will survive
      masking: {}
      scripts:
        - name: success
          script: ./actions.yaml
          script_type: ansible
          params:
            ansible_tags: ok
  contract_version: '2.1'
  venv: '2.16'
- type: host
  name: simple_host
  version: 2
  actions: *id001
