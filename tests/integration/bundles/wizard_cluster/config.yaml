---
- type: cluster
  name: cluster_wizard
  version: &version '1.0'
  edition: community
  allow_maintenance_mode: true

  actions:
    wizard_jinja: &wizard_action
      type: job
      script: ./sleep.yaml
      script_type: ansible
      wizard_template:
        file:
          path: wizard_jinja/stages.j2
        engine:
          type: jinja2
      states:
        available: any
    simple: &simple_action
      type: job
      script: ./simple_action.yaml
      script_type: ansible
      states:
        available: any

  config: &config
    - name: float
      type: float
      required: false
      default: 0.1
    - name: group1
      type: group
      subs:
        - name: list_field
          required: false
          default:
            - entry1
            - entry2
          type: list

- type: service
  name: service_1
  version: "0.1"
  actions:
    wizard_jinja:
      <<: *wizard_action
    simple:
      <<: *simple_action
  config: *config

  components:
    component_1: &component
      actions:
        wizard_jinja:
          <<: *wizard_action
        simple:
          <<: *simple_action
      config: *config
    component_2:
      <<: *component
