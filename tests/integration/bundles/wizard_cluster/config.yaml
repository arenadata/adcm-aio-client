---
- type: cluster
  name: cluster_wizard
  version: '1.0'
  edition: community
  allow_maintenance_mode: true
  actions:
    wizard_jinja:
      wizard_template: &id001
        file:
          path: wizard_jinja/stages.j2
        engine:
          type: jinja2
      states: &id002
        available: any
      scripts:
        - name: wizard_jinja
          script: ./sleep.yaml
          script_type: ansible
    wizard_fail:
      wizard_template:
        file:
          path: wizard_jinja/stages_fail.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: wizard_fail
          script: ./sleep.yaml
          script_type: ansible
    wizard_with_mapping:
      wizard_template:
        file:
          path: wizard_jinja/stages_mapping.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: wizard_with_mapping
          script: hc_apply
          script_type: internal
    simple:
      states: &id003
        available: any
      scripts:
        - name: simple
          script: ./simple_action.yaml
          script_type: ansible
    single_config_step:
      wizard_template:
        file:
          path: single_config_step/stages.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: single_config_step
          script: ./sleep.yaml
          script_type: ansible
  config: &id004
    - name: float
      type: float
      required: false
      default: 0.1
    - name: group1
      type: group
      subs:
        - name: list_field
          required: false
          default:
            - entry1
            - entry2
          type: list
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: service_1
  version: '0.1'
  actions:
    wizard_jinja:
      wizard_template: *id001
      states: *id002
      scripts:
        - name: wizard_jinja
          script: ./sleep.yaml
          script_type: ansible
    simple:
      states: *id003
      scripts:
        - name: simple
          script: ./simple_action.yaml
          script_type: ansible
  config: *id004
  components:
    component_1:
      actions: &id005
        wizard_jinja:
          wizard_template: *id001
          states: *id002
          scripts:
            - name: wizard_jinja
              script: ./sleep.yaml
              script_type: ansible
        simple:
          states: *id003
          scripts:
            - name: simple
              script: ./simple_action.yaml
              script_type: ansible
      config: *id004
    component_2:
      actions: *id005
      config: *id004
    component_3:
      actions: *id005
      config: *id004
