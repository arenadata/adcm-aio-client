---
- type: provider
  name: complex_provider
  version: '1.0'
  config_group_customization: true
  config:
    - name: json
      type: json
      required: false
      default:
        key: value
    - name: group
      type: group
      subs:
        - name: map
          type: map
          required: false
          default:
            integer_key: '10'
            string_key: string
    - name: activatable_group
      type: group
      activatable: true
      active: true
      subs:
        - name: secretmap
          type: secretmap
          required: false
          default:
            integer_key: '10'
            string_key: string
  actions:
    provider_action:
      states: &id001
        available: any
      scripts:
        - name: provider_action
          script: ./playbook.yaml
          script_type: ansible
    with_config: &id002
      display_name: Configurable one
      config:
        - name: string_field
          type: string
        - name: params
          display_name: Some Params
          type: group
          subs:
            - name: cant_find
              type: string
              default: cantCme
              ui_options:
                invisible: true
            - name: pass
              type: password
              required: false
            - name: sag
              display_name: Filter
              type: structure
              yspec: ./sag.yaml
              default:
                nested:
                  attr: nice
                  op: eq
                  tech: 'true'
                quantity: 14443
        - name: payload
          display_name: Request Body
          type: json
          default:
            - 1
            - k: v
            - plain
      states: *id001
      scripts:
        - name: with_config
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- type: host
  name: host
  version: '1.0'
  config:
    - name: structure
      type: structure
      required: false
      yspec: ./schema.yaml
      default:
        - integer: 1
          string: string1
        - integer: 2
          string: string2
    - name: variant
      type: variant
      source:
        type: config
        name: group/list
      default: value1
    - name: group
      type: group
      subs:
        - name: list
          type: list
          required: false
          default:
            - value1
            - value2
            - value3
    - name: activatable_group
      type: group
      activatable: true
      active: true
      subs:
        - name: option
          type: option
          required: false
          option:
            string1: string1
            string2: string2
          default: string1
  actions:
    host_action:
      display_name: host_action
      states:
        available: any
      scripts:
        - name: host_action
          script: ./playbook.yaml
          script_type: ansible
    with_config: *id002
